reviews:
  - author: "Nastassja"
    rating: 5
    text: "I called for some info and got an answer on the first ring! The service was impeccable. I needed my new tires installed and the pricing was super affordable and only took about an hour. I would definitely recommend Pete’s Auto Service with a smile 😊"
  - author: "Michele Palacios"
    rating: 5
    text: "This place was a godsend! Alex was very kind and professional and his team professional as well. This is a very honest and reasonably priced place. I am very grateful for getting my car fixed and feeling safe driving now. Thank you."
  - author: "Mike K"
    rating: 5
    text: "I've been bringing my cars here for several years now. Alex does a good job on my repairs and his prices are reasonable."
  - author: "Deshawn Jackson"
    rating: 5
    text: "Pete’s is great! Fair pricing, fast service, and locally owned. They went to great lengths to find me a part to fix my car and gave me the option of OEM, aftermarket, and used parts. They easily could’ve just told me I needed to get the OEM part for $350. I stumbled across them on google and they will now be my go to for mechanical services"
  - author: "Kelly-Ann Sutherland"
    rating: 5
    text: "Chester is a master mechanic! And A/C was finally fixed after wasting time & money at Vera Cadillac & Toyota of North Miami"
  - author: "Margarita Gjini"
    rating: 5
    text: "Definitely the most trustworthy mechanic that I’ve ever met. Alex has a wonderful and caring team as well. They did nice job in my car"
  - author: "Diane Mankowski"
    rating: 5
    text: "Alex the owner is fabulous!!! I just moved down here and needed a mechanic when I got stuck. My Jeep would not start and I needed a tow. 2 mechanics and 3 tows later Alex diagnosed my problem and repaired my Jeep. His communication was outstanding and his prices were affordable!!! Definitely my go to guy in the future. Thank you again Alex for a great job👍👍👍"
  - author: "B L"
    rating: 5
    text: "Wonderful service. Alex and his crew are attentive, meticulous and most Importantly .. they genuinely care. I went in for an oil change and new front tires and everything was done quickly and efficiently. Definitely highly recommend Pete’s for all your auto needs! Thanks again Alex!"
  - author: "Maya F"
    rating: 5
    text: "They deserve more than 5 stars, excellent customer service! I came in thinking I needed new rear brake pads, but instead they told me the brake pads didn’t need to be changed. I waited less than 5 minutes to have my car seen and driven around to hear any squealing/grinding. Also, informed me of other mechanical issues with my car, but insisted it wasn’t was an emergency or necessary to be fixed right away. I’m so blessed for the transparency and truthfulness. I’ve recommended family and friends, and will be back again at Pete’s Autoshop to get the job done if need be. Thank you guys so much!"
  - author: "Marcia Barrera"
    rating: 5
    text: "This place is very \"Woman's Friendly\". Do you ever get the feeling when you walk into a mechanic shop and the mechanic sees you as his next victim because you are a woman and you know nothing about cars? This is not it, Pete explained the problem with my car, and when I asked what about any other parts that needed to be replaced, he stated he wouldn't change anything unless it was necessary. They are here to establish a relationship based on trust and not to get all your money right away. I will definitely come back to see him."
  - author: "Ed Grohoski"
    rating: 5
    text: "Dropped off car with noise when braking. Tires brand new and brakes <1yr. They rotated tires while checking the brakes and their inflation. Didn’t find any problems. Put it all back together. Noise is gone, and they didn’t charge me anything. Now that’s the kind of service I thought I could only find in Maine. I highly recommend Pete’s Auto Service. Thanks Ed of EDS ELECTRIC. My Florida host says he agrees."
  - author: "Steve Skerrett"
    rating: 5
    text: "There is no doubt that Alex is the best mechanic in Florida. He's honest, patient and will always give you a fair price so you never feel as though your being taken advantage of. Even though he is a distance away he will be the only person who works on my vehicle. The way he does business is the blueprint for success"
  - author: "Paula Richmond"
    rating: 5
    text: "First, for transparency, I am a former owner of an auto repair shop. With that said, Pete's Auto is the shop I've been searching for since moving to FL in 1991. Brought a 2015 Ford Edge in to the place I HAD BEEN using, got a diagnosis I wasn't convinced of and an estimate of $2400 (which IMO was too much for the job he was recommending). Brought it to Pete's, the diagnosis was much more likely and the estimate of $1250 was also appropriate. Job was completed in a timely manor, car was clean and working properly when picked up. Staff was informative and communicated well. Will be bringing my other cars there from now on. Oh, and the actual cost came in a little lower than quoted."
  - author: "MICHAEL carty"
    rating: 5
    text: "Pete's Complete Auto has been my go to repair shop since the mid 2000's . Always great service at reasonable prices. This place will always be the to auto repair shop for my family"
  - author: "Melody Berrios"
    rating: 5
    text: "The service I received was above and beyond. The professional service from the assistant Catherine to the owner/mechanic Pete. I was always kept up to date and I was sent pictures and the cause of my air conditioning issue. Most places do …"
  - author: "Vassili Bazalitski"
    rating: 5
    text: "Great service, excellent timely repair, friendly staff, highly knowledgeable and efficient. As soon as I pulled up to the front of the shop the closest mechanic to me came up to greet and offer his help. Within next 40 seconds the problem was diagnosed and in another 2 minutes I was put on the schedule for repair. No BS, no offers to buy new tires, rebuild the engine or change brake pads. The guys are honest, fair and non contemptuous. On the day of the service they took the car, gave me a call with an estimate of charges and when I picked her up, all of the problems were solved. (I brought this car before to a Nissan dealership, but after their repair the problem persisted) Would I go anywhere else with my car problems? Of course not A+++ Way to go guys!"
  - author: "i2Profit"
    rating: 5
    text: "Great team of professionals! Car was returned on time and their cost of repairs was just under the rates quoted by other shops. I have taken my car to them for multiple issues and have always had reliable service. Definitely would recommend!"
  - author: "Joseph Namm"
    rating: 5
    text: "This was my 3rd time leaving a vehicle for Pete's to work on. I have been happy each time. In the past I have done all the work on my cars myself so I am a bit picky. But over the last few years I have not had the time so I tried a few different mechanics. Pete's was the only that I felt was honest and fair."
  - author: "Thomas Longo"
    rating: 5
    text: "I have 4 cars in my driveway, and they all come here to Pete's. Alex is honest, very fair on his prices, and dose all the work in a timely manner. Also very clean. Your fooling yourself if your going to someone else. 😎"
  - author: "Atempleh"
    rating: 5
    text: "If you want experience, knowledge and honesty out of an auto mechanic, then bring your car to Pete's. It is family owned and operated and they will take care of YOU like family. And if that isn't enough, they won't charge you a dime more than necessary. I've been bringing my cars to them for about 8 years and I won't go anywhere else."
  - author: "Dave DutchbornraisedAmerican"
    rating: 5
    text: "Alex is the most honest and more importantly, the most thoughtful and thorough mechanic (that means a lot coming from an apprentice that worked his way up to a journeyman and EARNED the title of mechanic or master in construction). If you fear something is wrong and you don't need it, he'll tell you. For some of you, he has your 6. For the rest, trust him, he's the best uncle you will ever meet"
  - author: "Sheila Carpenter"
    rating: 5
    text: "Being elderly, I rely on Alex and his team to ensure good running of my car. He and Kat and the team have gone above and beyond with their exceptional service and professionalism. Thank you all for being there for me once again."
  - author: "A Edwards"
    rating: 5
    text: "Pete’s mechanic shop to care of my brakes. I was in and out in no time. I appreciate the work the mechanics do over at this garage. They are very trustworthy! Thanks Pete for your service."
  - author: "Maria Z"
    rating: 5
    text: "My family has been coming to Pete’s for almost a decade. You will never find a better mechanic. Thank you for all of your hard work and excellent service across the years. Don’t waste your time and money, go straight to the best go to Pete’s!"
  - author: "Darryl Dansby"
    rating: 5
    text: "Always good professional service and the techs are friendly and knowledgeable. I do recommend this place to anyone that need Vehicle work at a fair price."
  - author: "Donna Reddicks"
    rating: 5
    text: "Tire repair. I discovered a nail in my tire this morning and my husband took my toyota camry LE in for repair. It took very short time to repair and minimal cost to do it. I will return with future needs for my vehicle when needed. Quick service."
  - author: "Cheryl Pattinson"
    rating: 5
    text: "This is the place to go!! Alex, is friendly, honest and professional! Fixed my car even though the parts were rusted completely on. They go above and beyond good customer service!"
  - author: "Alessandro R."
    rating: 5
    text: "I had an immediate problem with my brakes and Alex and his co-worker (I guess Rodrigo?) Solved it right away! Great service, Knowledge and care to fulfill my request. I would recommend this company to anyone. I actually do!"
  - author: "Punit Kulkarni"
    rating: 5
    text: "Fixed my Nissan Versa’s AC blower motor here. Had a very good experience w them quoting reasonable price and fixing the blower w the part I provided w no fuss no bother. Definitely recommend!"
  - author: "Google Reviewer"
    rating: 5
    text: "I can always count on Alex to resolve my car issues. Even if I contact him suddenly for emergency reasons. I always feel like family every time I visit. Highly recommended!"
  - author: "J Mit"
    rating: 5
    text: "Professional experience and knowledgable staff. Attention to detail and customer service was great by Alex. I will def continue to bring my car here for services."
  - author: "Grant Rogers"
    rating: 5
    text: "Best auto shop I've ever been to, awesome prices and superb technical knowledge. Pete's complete was willing and able to fix my brake lines, when many other shops in the area weren't willing to do so."
  - author: "Jona Jona"
    rating: 5
    text: "Great place, very knowledgeable technicians. Hands down Great experience. I was sent from E's Coast Customs to them and honestly Great people to work with."
